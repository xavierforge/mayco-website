<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* 在 React 掛載前先把主題套上，否則暗色主題會先閃一下亮底。
         規則與 src/hooks/useTheme.ts 一致：有存偏好就照偏好，否則看當地時間。 */
      (function () {
        try {
          var saved = localStorage.getItem("mayco-theme");
          var hour = new Date().getHours();
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : hour >= 6 && hour < 18
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="美可女子 Mayco — 一個到處撿到動物的女畫仔。Welcome to my zoo. 願你被美好團團包圍 (´,,•ω•,,)♡" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>美可女子 Mayco · Welcome to my zoo.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
